<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal-backdrop {
            z-index: 0;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-2 bg-light vh-100">
            <div class="nav flex-column nav-pills mt-4">
                <a class="nav-link active" th:href="@{/admin}">Admin</a>
                <a class="nav-link" th:href="@{/user}">User</a>
            </div>
        </div>

        <!-- Main content -->
        <div class="col-10">
            <div class="d-flex justify-content-between align-items-center mt-4">
                <h2>Admin panel</h2>
                <span><b th:text="${currentUserName}"></b> with roles: <b th:text="${currentUserRoles}"></b></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-dark">Logout</button>
                </form>
            </div>

            <!-- Tabs -->
            <ul class="nav nav-tabs mt-3">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#users">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#create">New User</a>
                </li>
            </ul>

            <!-- Users table -->
            <div class="tab-content mt-3">
                <div class="tab-pane fade show active" id="users">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Roles</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.roles}"></td>
                            <td th:text="${#temporals.format(user.createdAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd.MM.yyyy HH:mm')}"></td>
                            <td th:text="${#temporals.format(user.updatedAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd.MM.yyyy HH:mm')}"></td>
                            <td>
                                <button class="btn btn-info btn-sm" data-bs-toggle="modal"
                                        data-bs-target="#editModal"
                                        th:attr="data-id=${user.id},
                                             data-username=${user.username},
                                             data-createdat=${user.createdAt},
                                             data-updatedat=${user.updatedAt},
                                             data-roles=${user.roles}">
                                    Edit
                                </button>

                            </td>
                            <td>
                                <button class="btn btn-danger btn-sm" data-bs-toggle="modal"
                                        data-bs-target="#deleteModal"
                                        th:attr="data-id=${user.id}, data-username=${user.username}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- New User Tab -->
                <div class="tab-pane fade" id="create">
                    <form th:action="@{/admin/create}" method="post" class="mt-3 w-50">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Roles</label>
                            <div th:each="role : ${allRoles}" class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="selectedRoles"
                                       th:id="${'new-role-' + role.id}"
                                       th:value="${role.id}">
                                <label class="form-check-label" th:for="${'new-role-' + role.id}" th:text="${role.name}"></label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success">Create User</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/admin/edit}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" name="id" id="editId">
                <input type="hidden" name="createdAt" id="editCreatedAt">
                <input type="hidden" name="updatedAt" id="editUpdatedAt">

                <div class="mb-3">
                    <label for="editUsername" class="form-label">Username</label>
                    <input type="text" name="username" id="editUsername" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Roles</label>
                    <div th:each="role : ${allRoles}" class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               name="selectedRoles"
                               th:id="${'role-' + role.id}"
                               th:value="${role.name}">
                        <label class="form-check-label" th:for="${'role-' + role.id}" th:text="${role.name}"></label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="editPassword" class="form-label">New Password</label>
                    <input type="password" name="password" id="editPassword" class="form-control">
                </div>
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </form>
    </div>
</div>


<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/admin/delete}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Delete user <strong id="deleteUsername"></strong>?</p>
                <input type="hidden" name="id" id="deleteId">
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-danger">Delete</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const editModal = document.getElementById('editModal');
    editModal.addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;


    document.getElementById('editId').value = button.getAttribute('data-id');
    document.getElementById('editUsername').value = button.getAttribute('data-username');
    document.getElementById('editPassword').value = ''; // очищаем поле

    // Если даты нужны (например, для передачи в контроллер)
    document.getElementById('editCreatedAt').value = button.getAttribute('data-createdat');
    document.getElementById('editUpdatedAt').value = button.getAttribute('data-updatedat');

        // Если у кнопки есть data-roles="ADMIN,USER"
        const selectedRoles = button.getAttribute('data-roles').split(',');
        const checkboxes = document.querySelectorAll('#editModal input[name="selectedRoles"]');
        checkboxes.forEach(checkbox => {
            checkbox.checked = selectedRoles.includes(checkbox.value);
        });
    });


    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        document.getElementById('deleteId').value = button.getAttribute('data-id');
        document.getElementById('deleteUsername').innerText = button.getAttribute('data-username');
    });

    document.addEventListener("DOMContentLoaded", function () {
        const hash = window.location.hash;
        if (hash === "#create") {
            const tabTrigger = document.querySelector('a[href="#create"]');
            if (tabTrigger) {
                new bootstrap.Tab(tabTrigger).show();
            }
        }
    });
</script>
</body>
</html>
