<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .btn-container {
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
        button {
            margin: 0 10px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <h2 style="text-align:center;">User-list</h2>
        <table>
            <thead>
               <tr>
                   <th>UUID</th>
                   <th>Name</th>
                   <th>Password</th>
               </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <a th:href="@{/users/user-update/{id}(id=${user.id})}"
                           th:text="${user.id}" style="color: darkcyan;"></a>
                    </td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.password}"></td>
                    <td style="padding: 0; border: 0 solid #ddd; width: auto;">
                        <form th:action="@{/users/user-delete/{id}(id=${user.id})}" method="post" style="display: inline;">
                            <button type="submit"
                                    style="background: none; border: none; color: red; cursor: pointer; padding: 0; text-decoration: underline;">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="btn-container">
            <a href="/users/user-create">
                <button type="button">Create user</button>
            </a>
        </div>
    </div>
</body>
</html>
